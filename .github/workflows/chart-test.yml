name: Chart Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/chart-test.yml"
  workflow_dispatch:

jobs:
  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install packages
        run: pip install yfinance matplotlib requests

      - name: Create and send chart
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > /tmp/test_chart.py <<'PY'
          import os
          import requests
          import yfinance as yf
          import matplotlib.pyplot as plt

          ticker = "MBG.DE"
          hist = yf.Ticker(ticker).history(period="6mo", interval="1d", auto_adjust=True)
          close = hist["Close"].dropna()
          if len(close) < 2:
              raise RuntimeError("Dati insufficienti")

          fig, ax = plt.subplots(figsize=(9, 4.8))
          ax.plot(close.index, close.values, linewidth=1.8)
          ax.set_title("Mercedes-Benz (MBG.DE) - ultimi 6 mesi")
          ax.set_ylabel("Prezzo")
          ax.grid(True, alpha=0.25)
          fig.autofmt_xdate()
          fig.tight_layout()
          path = "/tmp/market_radar_chart.png"
          fig.savefig(path, dpi=150)
          plt.close(fig)

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]
          with open(path, "rb") as image:
              response = requests.post(
                  "https://api.telegram.org/bot" + token + "/sendPhoto",
                  data={
                      "chat_id": chat_id,
                      "caption": "✅ MARKET RADAR — TEST GRAFICO\nMercedes-Benz — ultimi 6 mesi"
                  },
                  files={"photo": image},
                  timeout=45
              )
          response.raise_for_status()
          print("Grafico inviato")
          PY
          python /tmp/test_chart.py
