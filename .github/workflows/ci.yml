name: Radar CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install
        run: |
          pip install -r requirements.txt
          pip install pytest

      - name: Syntax
        run: python -m py_compile main.py radar.py macro_learning.py wti.py

      - name: Unit tests
        run: pytest -q
