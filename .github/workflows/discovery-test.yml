name: Temporary Discovery Test

on:
  push:
    branches: [main]

jobs:
  discovery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Test equity discovery
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_DISCOVERY_MODEL: gpt-6-luna
        run: |
          python - <<'PY'
          from radar import _discover_equity_candidates
          items = _discover_equity_candidates("2026-10-05")
          print("DISCOVERY_RESULT=" + ",".join(str(x.get("ticker", "")) for x in items))
          PY
