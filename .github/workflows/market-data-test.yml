name: Market Data Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/market-data-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance requests matplotlib pandas

      - name: Historical Boeing replay test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests
          import yfinance as yf
          import matplotlib.pyplot as plt
          import pandas as pd

          target_date = pd.Timestamp("2026-09-28")
          start_6m = pd.Timestamp("2026-03-28")
          end_fetch = pd.Timestamp("2026-09-29")

          def history_to_date(ticker, start, end):
              hist = yf.Ticker(ticker).history(
                  start=start.strftime("%Y-%m-%d"),
                  end=end.strftime("%Y-%m-%d"),
                  interval="1d",
                  auto_adjust=True
              )
              if hist is None or hist.empty:
                  raise RuntimeError(f"Nessun dato per {ticker}")
              hist = hist.copy()
              hist.index = pd.to_datetime(hist.index).tz_localize(None)
              return hist[hist.index <= target_date]

          ba = history_to_date("BA", start_6m, end_fetch)
          sp = history_to_date("^GSPC", pd.Timestamp("2026-09-20"), end_fetch)

          ba_close = ba["Close"].dropna()
          sp_close = sp["Close"].dropna()
          if len(ba_close) < 2 or len(sp_close) < 2:
              raise RuntimeError("Dati insufficienti per replay storico")

          ba_last = float(ba_close.iloc[-1])
          ba_prev = float(ba_close.iloc[-2])
          ba_chg = (ba_last / ba_prev - 1) * 100

          sp_last = float(sp_close.iloc[-1])
          sp_prev = float(sp_close.iloc[-2])
          sp_chg = (sp_last / sp_prev - 1) * 100

          rel = ba_chg - sp_chg
          sixm = (ba_last / float(ba_close.iloc[0]) - 1) * 100

          fig, ax = plt.subplots(figsize=(9, 4.8))
          ax.plot(ba_close.index, ba_close.values, linewidth=1.8)
          ax.scatter([ba_close.index[-1]], [ba_close.iloc[-1]], s=32)
          ax.set_title("Boeing (BA) — 6 mesi fino al 28/09/2026")
          ax.set_ylabel("Prezzo")
          ax.grid(True, alpha=0.25)
          fig.autofmt_xdate()
          fig.tight_layout()
          chart_path = "boeing_replay_2026-09-28.png"
          fig.savefig(chart_path, dpi=150)
          plt.close(fig)

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          with open(chart_path, "rb") as f:
              r = requests.post(
                  f"https://api.telegram.org/bot{token}/sendPhoto",
                  data={
                      "chat_id": chat_id,
                      "caption": (
                          "🧪 MARKET RADAR — REPLAY STORICO\n"
                          "Boeing (BA) — situazione vista come se fossimo al 28/09/2026\n"
                          f"Performance 6 mesi fino a quel giorno: {sixm:+.2f}%"
                      )
                  },
                  files={"photo": f},
                  timeout=45,
              )
          r.raise_for_status()

          msg = (
              "🧪 MARKET RADAR — REPLAY 28/09/2026\n\n"
              f"Boeing: {ba_last:.2f} ({ba_chg:+.2f}%)\n"
              f"S&P 500: {sp_last:.2f} ({sp_chg:+.2f}%)\n"
              f"Anomalia relativa: {rel:+.2f} punti\n"
              f"Performance BA 6 mesi: {sixm:+.2f}%\n\n"
              "Questo test usa SOLO prezzi disponibili fino al 28/09/2026, "
              "così verifichiamo il radar senza guardare il futuro.\n"
              "Il giudizio AI completo arriverà quando sarà attiva la chiave API."
          )

          r = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data={"chat_id": chat_id, "text": msg},
              timeout=30,
          )
          r.raise_for_status()
          print(msg)
          PY
