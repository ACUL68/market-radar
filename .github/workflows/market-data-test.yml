name: Market Data Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/market-data-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance requests matplotlib

      - name: Test Western Digital and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests
          import yfinance as yf
          import matplotlib.pyplot as plt

          symbols = {
              "Western Digital": "WDC",
              "Nasdaq 100": "^NDX",
          }

          lines = ["✅ MARKET RADAR — TEST WESTERN DIGITAL"]
          ok = 0

          for name, ticker in symbols.items():
              hist = yf.Ticker(ticker).history(period="5d", interval="1d", auto_adjust=True)
              closes = hist["Close"].dropna() if hist is not None and "Close" in hist else []
              if len(closes) >= 2:
                  last = float(closes.iloc[-1])
                  prev = float(closes.iloc[-2])
                  chg = (last / prev - 1) * 100
                  lines.append(f"{name}: {last:.2f} ({chg:+.2f}%)")
                  ok += 1
              else:
                  lines.append(f"{name}: dato non disponibile")

          hist6 = yf.Ticker("WDC").history(period="6mo", interval="1d", auto_adjust=True)
          closes6 = hist6["Close"].dropna()
          if len(closes6) < 2:
              raise RuntimeError("Dati insufficienti per il grafico WDC")

          first = float(closes6.iloc[0])
          last = float(closes6.iloc[-1])
          sixm = (last / first - 1) * 100

          fig, ax = plt.subplots(figsize=(9, 4.8))
          ax.plot(closes6.index, closes6.values, linewidth=1.8)
          ax.scatter([closes6.index[-1]], [closes6.iloc[-1]], s=32)
          ax.set_title("Western Digital (WDC) — ultimi 6 mesi")
          ax.set_ylabel("Prezzo")
          ax.grid(True, alpha=0.25)
          fig.autofmt_xdate()
          fig.tight_layout()
          chart_path = "wdc_chart_test.png"
          fig.savefig(chart_path, dpi=150)
          plt.close(fig)

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          with open(chart_path, "rb") as f:
              r = requests.post(
                  f"https://api.telegram.org/bot{token}/sendPhoto",
                  data={
                      "chat_id": chat_id,
                      "caption": f"✅ MARKET RADAR — WESTERN DIGITAL\nWDC — grafico ultimi 6 mesi\nPerformance 6 mesi: {sixm:+.2f}%"
                  },
                  files={"photo": f},
                  timeout=45,
              )
          r.raise_for_status()

          lines.append(f"Performance WDC 6 mesi: {sixm:+.2f}%")
          lines.append(f"\nFeed verificati: {ok}/{len(symbols)}")
          r = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data={"chat_id": chat_id, "text": "\n".join(lines)},
              timeout=30,
          )
          r.raise_for_status()
          print("\n".join(lines))
          PY
