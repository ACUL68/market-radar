name: Market Data Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/market-data-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install yfinance requests matplotlib

      - name: Real Nike alert test
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests
          import yfinance as yf
          import matplotlib.pyplot as plt

          def snap(ticker):
              hist = yf.Ticker(ticker).history(period="5d", interval="1d", auto_adjust=True)
              closes = hist["Close"].dropna()
              if len(closes) < 2:
                  raise RuntimeError(f"Dati insufficienti per {ticker}")
              last = float(closes.iloc[-1])
              prev = float(closes.iloc[-2])
              return last, (last / prev - 1) * 100

          nke_last, nke_chg = snap("NKE")
          sp_last, sp_chg = snap("^GSPC")
          rel = nke_chg - sp_chg

          hist6 = yf.Ticker("NKE").history(period="6mo", interval="1d", auto_adjust=True)
          closes6 = hist6["Close"].dropna()
          if len(closes6) < 2:
              raise RuntimeError("Dati insufficienti per il grafico NKE")
          sixm = (float(closes6.iloc[-1]) / float(closes6.iloc[0]) - 1) * 100

          fig, ax = plt.subplots(figsize=(9, 4.8))
          ax.plot(closes6.index, closes6.values, linewidth=1.8)
          ax.scatter([closes6.index[-1]], [closes6.iloc[-1]], s=32)
          ax.set_title("Nike (NKE) — ultimi 6 mesi")
          ax.set_ylabel("Prezzo")
          ax.grid(True, alpha=0.25)
          fig.autofmt_xdate()
          fig.tight_layout()
          chart_path = "nike_real_test.png"
          fig.savefig(chart_path, dpi=150)
          plt.close(fig)

          token = os.environ["TELEGRAM_BOT_TOKEN"]
          chat_id = os.environ["TELEGRAM_CHAT_ID"]

          caption = (
              "🚨 MARKET RADAR — TEST REALE\n"
              f"Nike (NKE) — grafico 6 mesi\n"
              f"Performance 6 mesi: {sixm:+.2f}%"
          )
          with open(chart_path, "rb") as f:
              r = requests.post(
                  f"https://api.telegram.org/bot{token}/sendPhoto",
                  data={"chat_id": chat_id, "caption": caption},
                  files={"photo": f},
                  timeout=45,
              )
          r.raise_for_status()

          alert = (
              "🚨 MARKET RADAR — NIKE (NKE)\n\n"
              f"Nike: {nke_last:.2f} ({nke_chg:+.2f}%)\n"
              f"S&P 500: {sp_last:.2f} ({sp_chg:+.2f}%)\n"
              f"Anomalia relativa: {rel:+.2f} punti\n"
              f"Performance 6 mesi: {sixm:+.2f}%\n\n"
              "Causa rilevata: conti e guidance deboli; forte debolezza in Cina e turnaround ancora incerto.\n"
              "Contesto: soprattutto aziendale, non semplice calo generale del mercato.\n"
              "Rischi seri: pressione sui ricavi, concorrenza, sconti/promozioni e ristrutturazione ancora lunga.\n\n"
              "SATURNO: N\n"
              "Motivo: anomalia importante, ma il calo non appare un semplice storno sano dentro un trend forte. "
              "Caso da monitorare, non alert prioritario come occasione immediata.\n\n"
              "Fonti:\n"
              "Reuters — Nike results/guidance, 1 Oct 2026\n"
              "Reuters — turnaround concerns, 2 Oct 2026\n\n"
              "Test dimostrativo: dati di prezzo reali; giudizio finale precompilato finché l'API AI non è attiva."
          )

          r = requests.post(
              f"https://api.telegram.org/bot{token}/sendMessage",
              data={"chat_id": chat_id, "text": alert},
              timeout=30,
          )
          r.raise_for_status()
          print(alert)
          PY
