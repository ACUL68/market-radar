name: Market Radar

on:
  workflow_dispatch:
  schedule:
    # Europe/Rome: ogni slot ha un tentativo principale e un recupero +25 minuti.
    # GitHub cron usa UTC, quindi teniamo entrambe le varianti CET/CEST.
    # main.py ignora automaticamente la variante che arriverebbe troppo presto.
    # 08:15 Nikkei + recupero 08:40
    - cron: '15 6 * * 1-5'
    - cron: '15 7 * * 1-5'
    - cron: '40 6 * * 1-5'
    - cron: '40 7 * * 1-5'

    # 09:05 Europa + recupero 09:30
    - cron: '5 7 * * 1-5'
    - cron: '5 8 * * 1-5'
    - cron: '30 7 * * 1-5'
    - cron: '30 8 * * 1-5'

    # 15:35 USA + recupero 16:00
    - cron: '35 13 * * 1-5'
    - cron: '35 14 * * 1-5'
    - cron: '0 14 * * 1-5'
    - cron: '0 15 * * 1-5'

    # 21:45 ultimo controllo + recupero 22:10
    - cron: '45 19 * * 1-5'
    - cron: '45 20 * * 1-5'
    - cron: '10 20 * * 1-5'
    - cron: '10 21 * * 1-5'

concurrency:
  group: market-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Restore radar state
        uses: actions/cache@v4
        with:
          path: .radar_state.json
          key: market-radar-state-${{ github.run_id }}
          restore-keys: |
            market-radar-state-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Market Radar
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_DISCOVERY_MODEL: gpt-6-luna
          OPENAI_ANALYSIS_MODEL: gpt-6-sol
          GEMINI_DISCOVERY_MODEL: gemini-3.8-flash
          LARGE_CAP_MIN_MARKET_CAP: '10000000000'
          MIN_EQUITY_DROP_PCT: '-7.0'
          FORCE_SCAN: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          TRIGGER_SCHEDULE: ${{ github.event.schedule }}
        run: python main.py
