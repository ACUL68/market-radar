name: Telegram Test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/telegram-test.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Full AI radar smoke test
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          OPENAI_DISCOVERY_MODEL: gpt-6-luna
          OPENAI_ANALYSIS_MODEL: gpt-6-sol
          MAX_CANDIDATES: "2"
          FORCE_SCAN: "1"
        run: |
          python - <<'PY'
          import os, urllib.parse, urllib.request, subprocess, sys

          def send(text):
              token = os.environ["TELEGRAM_BOT_TOKEN"]
              chat_id = os.environ["TELEGRAM_CHAT_ID"]
              data = urllib.parse.urlencode({"chat_id": chat_id, "text": text}).encode()
              req = urllib.request.Request(
                  f"https://api.telegram.org/bot{token}/sendMessage",
                  data=data,
                  method="POST",
              )
              with urllib.request.urlopen(req, timeout=30) as r:
                  r.read()

          send("🧪 MARKET RADAR — TEST COMPLETO AI avviato\nStock + bond + ricerca cause con Luna/Sol.")
          result = subprocess.run([sys.executable, "main.py"], text=True, capture_output=True)
          print(result.stdout)
          print(result.stderr)
          if result.returncode != 0:
              send("❌ MARKET RADAR — TEST COMPLETO AI fallito. Controlliamo i log GitHub.")
              raise SystemExit(result.returncode)
          send("✅ MARKET RADAR — TEST COMPLETO AI terminato correttamente.")
          PY
